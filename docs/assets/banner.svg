<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">gentle-terminal</title>
  <desc id="desc">An AI agent supervising a coding agent in a real terminal: it waits by state, surfaces approval prompts to the human, and verifies the result before reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <text x="60" y="88" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#accent)">gentle-terminal</text>
  <text x="60" y="126" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">Approval-first terminal control for AI coding agents. Real shells, CLIs and TUIs, supervised by state.</text>
  <g transform="translate(60 160)">
    <rect width="1080" height="250" rx="14" fill="#0f172a" stroke="#334155"/>
    <rect width="1080" height="36" rx="14" fill="#1e293b"/>
    <rect y="22" width="1080" height="14" fill="#1e293b"/>
    <circle cx="24" cy="18" r="6" fill="#f87171"/>
    <circle cx="44" cy="18" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="18" r="6" fill="#34d399"/>
    <text x="540" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">session 1 &#183; pwsh &#183; /approved/workspace</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text x="24" y="76" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> codex "add a unit test for parseConfig"</text>
      <text x="24" y="112" fill="#e2e8f0"><tspan fill="#fbbf24">&#9679;</tspan> Working (1m 42s &#183; esc to interrupt)</text>
      <text x="610" y="112" fill="#7dd3fc">&#8594; timeout &#8800; done: re-read, classify, wait</text>
      <text x="24" y="148" fill="#e2e8f0"><tspan fill="#f472b6">?</tspan> Allow running `npm test`?  1. Yes, once  2. Always</text>
      <text x="610" y="148" fill="#7dd3fc">&#8594; surfaced to you, never "Always" unasked</text>
      <text x="24" y="184" fill="#e2e8f0"><tspan fill="#34d399">&#10003;</tspan> Worked for 2m 14s</text>
      <text x="610" y="184" fill="#7dd3fc">&#8594; artifact inspected, test re-run by agent</text>
      <text x="24" y="220" fill="#e2e8f0"><tspan fill="#34d399">PASS</tspan> tests/parse-config.test.js   <tspan fill="#94a3b8">exit 0</tspan></text>
      <text x="610" y="220" fill="#7dd3fc">&#8594; /quit, exit code observed, session closed</text>
    </g>
  </g>
</svg>

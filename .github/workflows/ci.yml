name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        include:
          - os: ubuntu-24.04-arm
            node: '24'
          - os: windows-11-arm
            node: '24'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned runtime
        run: npm run setup

      - name: Launcher version
        run: node launch.mjs --version

      - name: Test suite
        run: npm test

      - name: MCP smoke test
        run: npm run smoke

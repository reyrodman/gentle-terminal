name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove credentials, private paths and private terminal output before submitting.
        For security problems, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run setup
        2. Configure client X with ...
        3. Ask the agent to ...
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Output of `npm run verify`
      render: text
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Windows 11 x64 / macOS 15 arm64 / Ubuntu 24.04 x64
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: Windows PowerShell 5.1 / pwsh 7.5 / bash / zsh
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.12.0
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: Claude Code 2.x / Codex CLI 0.x / Cursor / OpenCode

name: Feature request
description: Suggest a new client, signal, example or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Does this change how agents handle approvals, credentials, cleanup or verification?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
